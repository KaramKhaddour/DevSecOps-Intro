# Otherwise-hardened, but violates exactly the two rules in extra/hardening.rego:
#   - image uses a tag (not a digest)       -> deny (digest pinning)
#   - drops ALL but adds NET_ADMIN back      -> warn (no added capabilities)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-violates
spec:
  replicas: 1
  selector:
    matchLabels: { app: juice }
  template:
    metadata:
      labels: { app: juice }
    spec:
      containers:
        - name: juice
          image: bkimminich/juice-shop:v19.0.0   # tag, not a digest -> deny
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]                 # adds a cap back -> warn
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: 3000 }
          livenessProbe:
            httpGet: { path: /, port: 3000 }
